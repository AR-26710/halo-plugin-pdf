<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>

  <div id="toolbar">
    <div class="toolbar-group" id="pageNavGroup">
      <button class="toolbar-btn" id="btnPrevPage" title="上一页 (←)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <input type="number" class="page-input" id="pageInput" value="0" min="1" title="当前页码" />
      <span class="page-total" id="pageTotal">/ 0</span>
      <button class="toolbar-btn" id="btnNextPage" title="下一页 (→)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <span class="toolbar-separator"></span>

    <div class="toolbar-group" style="position: relative;">
      <button class="toolbar-btn" id="btnZoomOut" title="缩小 (Ctrl+-)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <span class="zoom-display" id="zoomDisplay" title="点击切换缩放模式">100%</span>
      <button class="toolbar-btn" id="btnZoomIn" title="放大 (Ctrl++)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <div class="scale-popup" id="scalePopup">
        <div class="scale-popup-item" data-scale="page-width">适合宽度</div>
        <div class="scale-popup-item" data-scale="page-fit">适合页面</div>
        <div class="scale-popup-item" data-scale="0.5">50%</div>
        <div class="scale-popup-item" data-scale="0.75">75%</div>
        <div class="scale-popup-item" data-scale="1">100%</div>
        <div class="scale-popup-item" data-scale="1.25">125%</div>
        <div class="scale-popup-item" data-scale="1.5">150%</div>
        <div class="scale-popup-item" data-scale="2">200%</div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div class="toolbar-right">
      <button class="toolbar-btn" id="btnPageWidth" title="适合宽度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="btnPageFit" title="适合页面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
      </button>
      <span class="toolbar-separator"></span>
      <button class="toolbar-btn-text" id="btnDownload" title="下载 PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>下载</span>
      </button>
      <button class="toolbar-btn-text" id="btnFullscreen" title="全屏查看">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <span>全屏</span>
      </button>
    </div>
  </div>

  <div id="outerContainer">
    <div id="viewerContainer">
      <div id="viewer" class="pdfViewer"></div>
    </div>
  </div>

  <div class="overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingIndicator">PDF 加载中...</div>
  </div>

  <div class="overlay hidden" id="errorOverlay">
    <div id="errorBox">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-title">PDF 加载失败</div>
      <div class="error-detail" id="errorMessage"></div>
    </div>
  </div>

  <script type="module" src="viewer-app.mjs"></script>
</body>
</html>
